\"693\",\"static/chunks/693-ff0a1c83ff2ae072.js\",\"177\",\"static/chunks/app/layout-b606c1eda7112d3d.js\"],\"default\"]\na:I[3451,[],\"\"]\nb:I[8663,[],\"\"]\nc:I[4852,[\"816\",\"static/chunks/b5f12c68-530c6b46ca1fa693.js\",\"271\",\"static/chunks/271-dde152b6e4d4a76b.js\",\"693\",\"static/chunks/693-ff0a1c83ff2ae072.js\",\"177\",\"static/chunks/app/layout-b606c1eda7112d3d.js\"],\"default\"]\nd:I[1225,[],\"OutletBoundary\"]\n10:I[1225,[],\"ViewportBoundary\"]\n12:I[1225,[],\"MetadataBoundary\"]\n14:I[9278,[],\"\"]\n:HL[\"/_next/static/css/6d80bd2ed1c3a2f8.css\",\"style\"]\n6:T192b,"])</script><script>self.__next_f.push([1,"\nimport { Outline } from '@/widget/outline';\n\n\u003cOutline\n  content={`이 글은 소프트웨어 디자인 패턴 중 하나인 싱글톤 패턴의 개념과 장단점을 설명한다. 또, 싱글톤 패턴 사용 시 발생할 수 있는 문제점과 이를 해결하기 위한 방법으로 의존성 주입(DI)을 소개한다.`}\n/\u003e\n\n## 싱글톤 패턴\n\n소프트웨어 개발에서 자주 듣게 되는 디자인 패턴 중 하나가 싱글톤 패턴이다.\n\n애플리케이션 전체에서 하나의 인스턴스만 생성해서 사용하는 패턴이다.\n\n예를 들어, 앱 전체에서 하나만 존재해야 하는 설정 관리 객체나 로깅 시스템처럼 매번 새로 생성하는 것보다 하나만 만들어서 공유하는 게 효율적일 때 싱글톤 패턴을 사용한다.\n\n### 왜 싱글톤 패턴을 사용할까?\n\n싱글톤 패턴은 주로 이런 상황에서 필요하다.\n\n- 하나의 인스턴스로 자원을 관리해야 할 때 (DB 연결, 설정값 관리 등)\n- 전역 상태를 유지해야 할 때\n- 객체 생성 비용이 클 때\n\n하지만 글로벌 상태처럼 사용되기 때문에 잘못 쓰면 오히려 코드 품질이 나빠질 수 있다.\n\n### 싱글톤 패턴 구현 방법\n\n간단하게 타입스크립트로 싱글톤 패턴을 구현하는 방법을 보자.\n\n```typescript\nclass Singleton {\n  private static instance: Singleton;\n\n  private constructor() {}\n\n  public static getInstance(): Singleton {\n    if (!Singleton.instance) {\n      Singleton.instance = new Singleton();\n    }\n    return Singleton.instance;\n  }\n}\n```\n\n`Singleton` 클래스의 인스턴스를 하나만 생성하고, `getInstance` 메서드로 반환한다.\n\n여기서 핵심은 `private constructor` 다. 외부에서 직접 인스턴스를 생성할 수 없고, 오직 `getInstance` 로만 인스턴스를 얻을 수 있다.\n\n### 장점과 단점\n\n이 패턴의 장점은 다음과 같다.\n\n- 하나의 인스턴스 관리: 메모리 효율적\n- 글로벌 접근: 어디서든 접근 가능\n- 상태 관리 용이: 공통 자원 공유에 유용\n\n당연히 단점도 있다.\n\n- 높은 결합도: 특정 클래스에 강하게 의존하게 됨\n- 테스트 어려움: 상태가 고정돼 Mock 작업이 어려움\n- 명시적 의존성 부족: 코드만 봐서는 어떤 의존성이 있는지 파악이 어려움\n\n특히 결합도 문제가 크다. 싱글톤 패턴을 사용하면 특정 클래스에 강하게 의존해서 코드의 유연성이 떨어질 수 있다. 그래서 꼭 필요한 경우에만 사용하는 게 좋다.\n\n또, 무분별하게 싱글톤을 남발하면 코드가 글로벌 상태에 의존하게 되어 복잡해지고 가독성이 떨어진다. 상태가 변하는 싱글톤 객체는 예측하기 어려우니 주의가 필요하다.\n\n## 의존성 주입\n\n싱글톤을 사용하다 보면 클래스 내부에서 직접 싱글톤 인스턴스의 메서드를 호출하게 된다. 이러면 클래스가 싱글톤에 강하게 의존해서 결합도가 높아진다. 테스트도 어려워지고 코드의 유연성도 떨어진다.\n\n### DI(Dependency Injection)란?\n\nDI는 필요한 의존성을 외부에서 주입받는 방식이다. 클래스 내부에서 직접 인스턴스를 생성하지 않고, 외부에서 주입받아 사용한다.\n\n이렇게 하면 클래스가 구체적인 구현체에 의존하지 않아서 테스트나 확장성이 좋아진다.\n\n### DI를 통한 싱글톤 사용 예시\n\nDI 없이 싱글톤을 사용한 예시다.\n\n```typescript\nclass ConsoleLogger {\n  private static instance: ConsoleLogger;\n\n  private constructor() {}\n\n  public static getInstance(): ConsoleLogger {\n    if (!ConsoleLogger.instance) {\n      ConsoleLogger.instance = new ConsoleLogger();\n    }\n    return ConsoleLogger.instance;\n  }\n\n  log(message: string): void {\n    console.log(message);\n  }\n}\n\nclass UserService {\n  private logger: ConsoleLogger;\n\n  constructor() {\n    this.logger = ConsoleLogger.getInstance();\n  }\n\n  createUser(name: string): void {\n    this.logger.log(`User ${name} created`);\n  }\n}\n\nconst userService = new UserService();\n```\n\n`UserService` 가 `ConsoleLogger` 에 강하게 의존하고 있어서 테스트도 어렵고, 다른 로깅 시스템으로 바꾸기도 힘들다.\n\n이번엔 DI를 활용한 예시를 보자.\n\n```typescript\ninterface Logger {\n  log(message: string): void;\n}\n\nclass ConsoleLogger implements Logger {\n  private static instance: ConsoleLogger;\n\n  private constructor() {}\n\n  public static getInstance(): ConsoleLogger {\n    if (!ConsoleLogger.instance) {\n      ConsoleLogger.instance = new ConsoleLogger();\n    }\n    return ConsoleLogger.instance;\n  }\n\n  log(message: string): void {\n    console.log(message);\n  }\n}\n```\n\n```typescript\nclass UserService {\n  private logger: Logger;\n\n  constructor(logger: Logger) {\n    this.logger = logger;\n  }\n\n  createUser(name: string): void {\n    this.logger.log(`User ${name} created`);\n  }\n}\n\nconst logger = ConsoleLogger.getInstance();\nconst userService = new UserService(logger);\n```\n\n`UserService` 가 `Logger` 인터페이스에 의존하게 되어, `ConsoleLogger` 외에도 다른 로깅 시스템을 쉽게 주입할 수 있다. 테스트할 때도 Mock 객체를 주입하면 된다.\n\n만약 파일에 로그를 남기는 `FileLogger`가 필요하다면 `Logger` 인터페이스를 구현한 `FileLogger` 클래스를 만들고, DI를 통해 주입하면 된다.\n\n```typescript\nclass FileLogger implements Logger {\n  private static instance: FileLogger;\n\n  private constructor() {}\n\n  public static getInstance(): FileLogger {\n    if (!FileLogger.instance) {\n      FileLogger.instance = new FileLogger();\n    }\n    return FileLogger.instance;\n  }\n\n  log(message: string): void {\n    // 파일에 로그 남기기\n  }\n}\nconst logger = FileLogger.getInstance();\nconst userService = new UserService(logger);\n```\n\n이렇게 DI를 활용하면 싱글톤 패턴을 사용하면서도 결합도를 낮추고, 테스트와 확장성을 높일 수 있다.\n\n## 결론\n\n싱글톤 패턴은 효율적인 자원 관리에 유용하지만, 잘못 사용하면 코드의 유연성을 해친다.\n\n그래서 싱글톤 패턴을 사용할 때는 주의가 필요하다. DI를 활용하면 싱글톤 패턴의 단점을 보완할 수 있다. 의존성을 외부에서 주입받으면 결합도를 낮추고 테스트와 확장성을 높일 수 있다.\n\n결국 언제, 어떻게 쓰느냐가 중요하다.\n"])</script><script>self.__next_f.push([1,"7:T483e,"])</script><script>self.__next_f.push([1,"\nimport { PhotoGrid } from '@/widget/photo-grid';\n\n원래 이 글을 더 빨리 작성하려 했는데, 미루고 미루다 이제야 쓰게 되었다.\n\n마지막으로 진행한 프로젝트인 `Ask-It` 팀원분이 다음 포스트는 졸업 관련해서 대학교 포스트냐고 물어봤었는데, \"그러지 않을까요?\"라고 대답했지만 굉장히 오랜 시간 동안 블로그 글을 작성하지 않았다.\n\n작은 변명을 하자면, 대학교 졸업식이 2월 19일이었고, 그다음 날 회사에서 서류 및 코딩 테스트 결과를 통보받아 면접을 준비해야 했다. 이와 동시에 여러 기업의 서류와 코딩 테스트를 준비하느라 의도치 않게 바빠졌다.\n\n어쨌든, 졸업하고 이런저런 일들을 많이 겪었지만 잠시 대학교 시절을 돌아보며 정리해보려고 한다.\n\n## 대학교 1학년\n\n대학교 진학에 별로 관심이 없었지만 집에서 그래도 대학은 가야한다는 이야기로 중학교때 접했던 개발을 해야겠다는 생각으로 해당 학과만을 목표로 하고 고등학교 생활을 했다.\n\n대학교 1학년… 이제 기억이 가물가물하다. 처음인 곳에서 모르는 사람들과 지낼 생각에 걱정도 많았고, 무엇을 해야 하는지도 잘 몰랐었던 것 같다. 그래도 다행히도 학교에서 개강총회나 MT 같은 행사 참여하면서 친해진 사람들과 학교 생활을 함께 하게 되면서 학교 생활 내내 외롭지 않게 잘 지낼 수 있었던 것 같다.\n\n덕분에 과제나 프로젝트나 이런저런 많은 것들을 함께 할 수 있었고, 삶에 많은 활력이 되어준 사람들이다. 기억나는 것으로는 할로윈 때 수업을 결석하고 에버랜드에 놀러 가곤 했는데, 원래 그 수업은 출결을 확인하지 않는데도 그날 유난히 사람이 많이 빠져서 결석 처리되었다 ㅠ...\n\n여러 공부를 하거나 뭐 하진 않았고 전공 관련해서는 알고리즘, 자료구조만 공부하고 백준 풀어가면서 하고 싶은 것만 했던 것 같다. 그렇게 어영부영 1년이 지나갔다.\n\n## 대학교 2학년\n\n전역하고 복학했을 때는 코로나로 인해 학교가 굉장히 많이 바뀌어 있었다. 1학년 때 쓰던 종정시도 사라지고 다른 서비스로 바뀌었고, 어쨌든 뭔가 변화가 많았다. 개강 전에 친구랑 같이 학교를 갔는데, 학교 시설이 저렇게 다 변한 것을 보고 묘한 기분이 들기도 했었다. 시간이 흘렀네 싶었다.\n\n\u003cPhotoGrid photos={['/post/University-Graduation/1.webp', '/post/University-Graduation/2.webp']} /\u003e\n\n개강하고는 별 생각 없이 대학교 수업들을 들었고 틈틈이 백준을 풀었던 것 같다. 1학기엔 배리어프리 앱 개발 공모전에 나가보기도 하고 2학기엔 친한 친구들과 만들고 싶은 주제의 프로젝트가 있어서 해당 프로젝트의 데모 버전을 수업 때 만들어서 진행해보기도 했다. 이때 안드로이드 개발을 처음 해보고 시스템이 잘 정돈된 상태에서 프로젝트를 진행해보지는 못했지만 첫 경험으로 즐겁게 할 수 있었던 것 같았다.\n\n이 프로젝트가 이후에 대학교 3학년 때 다른 과 친구들과 함께 프로젝트를 진행할 수 있는 기반이 되어서 어떻게 보면 나를 좀 바꿔주었던 프로젝트의 시작이었던 것 같다.\n\n작게는, 친구를 통해서 과 동아리도 새로 들어가고 그랬었는데 큰 활동은 안 하고 큰 회식 자리랑, 프로젝트와 스터디에만 가볍게 참여하고 적극적인 활동은 전혀 안 했다.\n\n복학하고 친구들이랑 같이 여행도 가고 소소하게 놀기도 하고 적극적으로 한 것도 없고 그냥 시간만 보냈다~\n\n\u003cPhotoGrid photos={['/post/University-Graduation/3.webp', '/post/University-Graduation/4.webp']} /\u003e\n\n대학교 2학년 2학기 때 친한 친구들과 진행한 하루라는 이름의 프로젝트가 있는데, 앞서 이야기한 안드로이드로 데모버전을 만들었던 프로젝트가 이 프로젝트이다.\n\n평소에 생산성 관리 툴에 관심이 많기도 했고 그런 툴을 만들고 싶다는 생각이 있었는데, 친구들이랑 같이 진행하게 되었다. 이 프로젝트를 통해서 안드로이드 개발을 처음 해보았고, 데모 버전을 만들게 되었다.\n\n지금 보면, 굉장히 디자인도 허접하고 웃기지만 그때는 정말 열심히 했던 것 같다. 이 프로젝트를 통해서 협업에 대해서도 많이 배웠고, 같이 일한다는 것이 굉장히 즐거웠다.\n\n\u003cPhotoGrid photos={['/post/University-Graduation/5.webp']} /\u003e\n\n소융대생들끼리 손으로 간단하게 프로토타입 디자인을 해보는 시간도 가졌었고, 정말 엉성하지만 나름 만들어가는 재미가 있었다.\n\n## 대학교 3학년\n\n### 하루\n\n학교에서 학점과 지원금을 주면서 프로젝트를 진행할 수 있는 제도가 있었다. 그 제도를 통해 12학점을 채우고 전공에서 중요시 여겨지는 운영체제, 데이터베이스, 컴퓨터 네트워크 그리고 개인적으로 코딩 테스트 역량은 유지하고 싶어서 실전 프로젝트라는 매 수업 시간마다 모의 코딩 테스트를 보는 과목이 있어서 해당 과목을 수강하여 총 22학점을 수강 신청했다. 개인적으로 대학교 생활 중에 가장 바쁜 시기였다.\n\n하루 프로젝트를 2학년 2학기에 이어서 진행하기로 했고, 새롭게 개발 팀원으로 준호형이 추가되고, 디자인과 친구들을 추가로 더 팀원으로 추가해서 총 8명이서 진행하게 되었다. 타과생과 뭔가 함께 협업하는 것도 처음이고, 개인적으로 매일 나랑 비슷한 생각을 하는 사람들끼리만 일하다가, 디자인적으로 훨씬 좋기도 하고 다른 관점의 이야기를 들어볼 수도 있어서 좋았다.\n\n그리고 이때 원래 안드로이드로만 개발되었었던 하루 프로젝트를 더 많은 사용자층에게 제공하고 싶은 생각이 들어, 나는 iOS 개발 파트로 넘어갔었다. 준호형이랑 같이 방학 때 동아리에서 iOS 스터디, 프로젝트 진행하면서 빠르게 iOS 개발을 배워서 진행하려고 노력했고, 혼자가 아니라서 더 빠르게 배울 수 있었던 것 같다.\n\n\u003cPhotoGrid photos={['/post/University-Graduation/6.webp', '/post/University-Graduation/7.webp']} /\u003e\n\n개발이 힘들기도 했지만 재미도 있었다. 개발팀이 총 6명이었는데 나 포함 3명은 같은 기숙사에 살면서 정말 매일 이야기 나누고 이슈 나누면서 문제를 해결하고자 했던 것도 기억이 난다.\n\n책상 위치가 민재형이랑 가까이 있었는데 민재형이 공책에다가 이거 어떻게 하면 좋을까? 하면서 같이 고민했던 것들이 기억에 많이 남아있다.\n\n홍석이랑 준호형이랑 민재형 피해서 몰래 PC방 다녀오고 혼나기도 하고 다 같이 술 먹으면서 힘든 거 이야기 나누기도 하고, 매일 새벽 5-6시까지 개발하다가 같이 아침 먹고 자고 난 뒤에 10시쯤에 다시 일어나서 씻고 수업 들으러 가고 그랬다.\n\n이때는 정말 매일매일이 힘들었지만, 그만큼 보람도 있었고, 정말 많은 것들을 배울 수 있었던 것 같다.\n\n이후 처음으로 서비스를 배포해보고 출시해보면서 묘한 감정이 같이 들었다. 뭔가 내가 만든 게 정말 서비스로 동작하는 모습을 보면서 뿌듯하기도 했고, 실제로 운영하면서 문제를 겪기도 했는데 그 문제를 수정하면서도 많은 생각을 할 수 있었다.\n\n이 하루라는 프로젝트는 거의 1년이라는 기간 동안 진행했고, 이후에 팀 전체가 다 같이 강릉 여행도 가면서 시간을 보냈었다.\n\n\u003cPhotoGrid\n  photos={[\n    '/post/University-Graduation/8.webp',\n    '/post/University-Graduation/9.webp',\n    '/post/University-Graduation/10.webp',\n  ]}\n/\u003e\n\n다시 보니 음식 사진을 다 대충 찍어서 올릴게 없다. ㅋㅋㅋㅋ\n\n### 2학기\n\n사실, 3학년 2학기엔 하루 프로젝트를 하면서 느꼈던 여러 생각들이 있어서 인공지능에 대해서 왠지 알아야 하지 않을까? 라는 생각이 들어서 그와 관련된 수업을 굉장히 많이 들었던 시기였다.\n\n그리고 딱히 프로젝트를 진행하지도 않았고 그냥 수업을 듣고, 기업에 지원서를 넣고 코딩 테스트를 보고 학교 인턴 면접을 보러 다니고 그랬던 것 같다. 개인적으론 뭔가 제일 생각이 복잡했던 시기였다.\n\n그래도 준호형이랑 하루 프로젝트 iOS 파트를 리팩토링하기도 하고 성능 개선하기도 하면서 여러 가지를 더 추가하긴 했지만 뭔가 크게 하진 않았다.\n\n그래도 아래 다이어그램을 보니 프로젝트 개발할 때 정말 열심히 했던 것 같다. 듣고 있던 수업에 과제로 제출할 보고서 때문에 만든 거였는데 모두 다 표현하기에 너무 많아서 추리고 추려서 저 정도로 만들었다. 보고서 작성하면서 형이랑 우리 정말 열심히 했던 거 같다고 정말 많이 이야기했다.\n\n\u003cPhotoGrid\n  photos={[\n    '/post/University-Graduation/11.webp',\n    '/post/University-Graduation/12.webp',\n    '/post/University-Graduation/13.webp',\n    '/post/University-Graduation/14.webp',\n    '/post/University-Graduation/15.webp',\n    '/post/University-Graduation/16.webp',\n  ]}\n/\u003e\n\n엉망이기도 하지만, 무튼 열심히 했던 것 같다.\n\n이때 다른 수업에서도 기억이 나는 게 조금씩 있는데, 운영체제의 실제라는 수업을 들으면서 프로세스 상태를 검사하고 모니터링하는 시스템을 만들면서 나름 재미도 있었고 특히 기억나는 것 중 하나가 컴퓨터 비전 수업이었다.\n\n뭐 성적이 좋진 못했지만 수업 중에 교수님께서 했던 이야기가 개인적으로 마음에 남아서 지금도 이력서나 자소서에 해당 내용을 항상 녹여내곤 한다.\n\n## 대학교 4학년\n\n대학교의 마지막 학년이 되었고, 벌써 시간이 이렇게 흘렀나 생각했던 시기였다. 항상 같이 프로젝트하던 사람들과 하는 게 아니라 새롭게 팀을 꾸려서 진행해보고 싶었다.\n\n### 캡스톤 디자인\n\n그래서, 4학년 1학기 때는 학교에서 진행하는 캡스톤 디자인에서 팀을 꾸려서 진행하게 되었다. 팀장은 내가 맡게 되었고, 기존에 같이 프로젝트하던 준호형과 같이 해보고 싶었던 연수형 그리고 새롭게 팀원을 모집해서 희정이까지 포함해서 개발팀은 총 4명이서, 그리고 아무것도 제공해드릴 수 없지만 디자인을 도와줄 사람도 구해서 총 5명이서 진행했다.\n\n평소에 지도 관련된 서비스를 한 번 만들어보고 싶다는 생각에 지도와 관련된 서비스를 만드는 것으로 팀적으로 논의했고 우리는 하우스메이트를 구하는 서비스를 제공하기로 하고 개발했었다.\n\n이 서비스에 추천 시스템과 프론트엔드 개발 그리고 팀장으로서 부가적인 거 계속 처리하면서 수업도 듣고 개인적으로 약간 체력적으로 부하가 오기도 했었다.\n\n중간에 디자인을 담당해주시던 분이 개인적인 사정으로 팀을 나가게 되어서, 디자인은 나랑 희정이가 많이 다시 진행하게 되었고, 정말 괴로웠다...\n\n한편으론 미안한 마음도 있었고, 잘 해보고 싶었는데 개인적으론 아쉬운 결과가 남아서 만족스럽진 못했다. 그래도 또 팀으로서 함께 했던 경험이 좋았고, 그래도 좋은 사람들이라 계속 이 멤버끼리 연락하고 지내고 있다.\n\n\u003cPhotoGrid photos={['/post/University-Graduation/17.webp', '/post/University-Graduation/18.webp']} /\u003e\n\n### 네이버 부스트캠프\n\n4학년 2학기엔 가장 기억에 남던 활동이 네이버 부스트캠프에 참여한 거 같다. 학점은 하루라는 프로젝트를 했던 것처럼 마음 맞는 사람들끼리 간단한 프로젝트를 교수님과 컨택해서 진행하기로 계획하고, 동시에 공모전도 참여하게 되었다.\n\n그리고 개인적으로 심적으로 힘들었는데 네이버 부스트캠프가 기억상 6월 말? 그쯤 시작하면서 정신없이 보내게 해줬던 거 같다.\n\n이 시기에 네부캠 진행하면서 정신없이 보내면서, 여행도 가서 힐링도 하고 나름 다시 체력적으로 정비할 수 있었다.\n\n\u003cPhotoGrid photos={['/post/University-Graduation/19.webp', '/post/University-Graduation/20.webp']} /\u003e\n\n사실 처음에 네부캠에 참여한 건 별로 생각도 없이 목표도 없이 그냥 취업에 뭐 도움되는 거 없을까? 라는 생각으로 지원하게 되었고, 그때는 정말 아무것도 모르고 지원했었다. 시험을 보라고 해서 보았고 과제가 주어지면 하라니까 했다.\n\n그리고 여기서 만난 사람들과 그렇게 인연이 깊어지게 될까? 싶은 생각도 많이 했었고 시간을 떼우기 위해서 하는 것이라고만 생각하고 처음엔 했었다.\n\n그런데, 막상 네부캠 진행하면서 많은 걸 배울 수 있었고, 정말 많은 좋은 사람들과 인연을 맺게 되어서 정말 좋았다.\n\n제일 기억에 남던 건 아무래도 그룹 프로젝트 경험이 기억에 남는데, 4명이서 진행하고 싶은 주제를 정하고, 그 주제에 맞는 서비스를 기획하고 개발하는 과정이 정말 좋았다. 처음엔 다 모르는 사람이고 성향도 아는 게 하나도 없어서 개인적으로는 좀 어려움이 있었지만 다들 정말 열심히 하셨고 적극적으로 참여해주셨던 게 정말 감사했다.\n\n게다가 처음에 팀이 모인 날, 팀원에게 별 생각 없이 저희 만나는 곳을 대학생이면 각자 학교 번갈아가면서 만나는 거 어때요? 하고 제안했던 게 생각보다 낭만 있었다. 각자 학교 돌아다니면서 맛있는 것도 먹고 좀 체력적으로 힘들 때 학교 구경도 하고 재미있었다.\n\n\u003cPhotoGrid\n  photos={[\n    '/post/University-Graduation/21.webp',\n    '/post/University-Graduation/22.webp',\n    '/post/University-Graduation/23.webp',\n    '/post/University-Graduation/24.webp',\n    '/post/University-Graduation/25.webp',\n    '/post/University-Graduation/26.webp',\n    '/post/University-Graduation/27.webp',\n    '/post/University-Graduation/28.webp',\n  ]}\n/\u003e\n\n먹기도 많이 먹고 학교에서 유명한 것들도 먹어보고 재밌었다.\n\n그리고 이후에 같이 리팩토링도 하면서 AI 기능도 새롭게 추가해보고 잘 쓰려면 뭘 고민해야 하고 하면서 혼자면 안 했을 거 같은데, 참여하게 되어서 재미있게 잘 진행할 수 있었던 것 같다.\n\n4학년 2학기에는 부스트캠프 외에도 공모전 참가하고, 학교에서 진행하는 프로젝트 때문에 정신없이 흘러가긴 했는데 모두 다 끝까지 할 수 있었고 목표했던 것대로 모든 일들을 다 마무리할 수 있었다.\n\n## 졸업\n\n뭔가 갑자기 시간이 지나서 졸업하는 느낌이 들었다. 분명 하던 프로젝트들이 오래된 이야기가 아닌 것 같은데 1년 전 2년 전 이러니까 기분이 이상했다.\n\n사실 별로 졸업식에 대해 생각이 없었는데 부모님께서 가고 싶어 하셔서 그럼 졸업식 가자고 했다.\n\n아무튼 가서 친구들이랑 사진도 찍고 가족들이랑 사진도 찍고 맛있는 것도 먹었다.\n\n그리고 이후에 대학교 동기들이랑 간단하게 술 먹고, 다음 날 일정이 있는 사람이 있어서 금방 헤어지긴 했다. 이후에 같이 네부캠에서 인연이 닿아서 친해진 분들을 만나서 간단하게 술 먹고 새벽 1-2시에 헤어진 것 같다.\n\n\u003cPhotoGrid\n  photos={[\n    '/post/University-Graduation/29.webp',\n    '/post/University-Graduation/30.webp',\n    '/post/University-Graduation/31.webp',\n    '/post/University-Graduation/32.webp',\n  ]}\n/\u003e\n\n일부 사진은 차마 올리기가 무서워서 올릴 수 없다. ㅋㅋㅋㅋ\n\n사진을 보니 기억나는 것은 저 날이 정말 추웠는데 학위복만 입고 몇 시간 동안 사진 찍고 서 있고 사람은 너무 많아서 정신이 없었던 것 같다.\n\n![33](/post/University-Graduation/33.webp)\n\n별거는 아니지만 졸업식 이후에 학교 후문에 차담이라는 카페에 있는데 말차 토닉을 시켜 먹어봤는데 생각보다 맛있어서 놀랐다. 개인적으로는 말차를 별로 선호하지는 않는데 말차 좋아하지 않는 사람에게도 추천할 만한 것 같다.\n\n졸업식 자체는 정말 정신 없었고 그 날 만날 수 있던 모든 분들에게 감사하다.\n\n그리고 대학교 생활하면서 같이 지냈던 많은 친구들이 있었고 의지할 수 있어서 재밌게 보낼 수 있었던 것 같았다. 대학교는 배움의 장소이기도 하지만 사람들과의 인연이 더 중요하다고 생각이 드는 것 같다. 개인적으론 내가 그래도 좀 성장했나? 싶은 부분은 과거에 프로젝트하면서 같이 일하는 것에 서툴다는 느낌을 많이 받았는데 마지막으로 진행했던 프로젝트에서는 그런 느낌이 많이 사라졌던 것 같다. 물론, 여전히 부족한 점이 많지만 그래도 나름 성장했다고 느끼는 부분이 많았다. 특히 팀원들과의 소통이 많이 편해졌고, 서로의 의견을 존중하고 잘 조율할 수 있었던 것 같다. 게다가 팀원들에게로부터 받은 마지막 피드백은 개인적으로 정말 좋았다.\n\n## 그 이후\n\n아무튼 대학교 졸업 이후에 다음 날에 지원한 회사에서 면접 통보를 받았었고, 최종 합격까지 했지만 그 회사도 너무나도 좋은 회사이지만 개인적으로 가장 희망하는 회사인 네이버에서 서류와 코딩 테스트를 합격했고, 후회하고 싶지 않아서 이번 기회에 모든걸 다 내려놓고 다 투자하기로 했다.\n\n이번 네이버 면접 기간에서 첫 번째 날에 면접을 보게 되어서 준비 기간이 길진 못한 점이 조금은 아쉽지만, 아쉬운대로 네이버 기술 역량 인터뷰를 진행했고 현재는 결과를 기다리고 있다.\n\n좋은 결과가 있으면 좋겠다.\n"])</script><script>self.__next_f.push([1,"8:T2ad3,"])</script><script>self.__next_f.push([1,"\n팀원들과 함께 개발하던 중, 특이한 현상을 발견했다.\n백엔드에서 ORM으로 `prisma`를 사용하고 있는 상황이였다. `repository` 레이어에서 데이터베이스에 레코드를 생성하기 위해서 아래 같이 코드를 작성했다.\n\n```ts\n// 예시 코드\ncreate(dto: DTO) {\n  this.prisma.table.create({ data: dto });\n}\n```\n\n큰 고민 없이, 데이터베이스에 접근하는 코드에서 그 이후에 특별히 해야하는 것이 없어서, `async/await` 키워드를 사용하지 않았고, 프로미스의 메서드들을 이용하지도 않았다.\n\n이후에 테스트를 진행하여, API를 호출하니 실제로 레코드가 생기지 않는 것을 확인할 수 있었다. 어떠한 이유였을까?\n\n이런 저런 이유를 알아보기 위해서 많은 테스트를 했지만 결과적으로 알아낸 것은, `await`, `then`, `catch`, `finally` 와 같은 키워드, 메서드를 이용해서 호출하지 않으면 실행되지 않는다는 것을 발견했다.\n\n즉, 아래와 같은 형태는 정상적으로 실행이 된다.\n\n```ts\ncreate(dto: DTO) {\n  this.prisma.table.create({ data: dto }).then();\n}\n```\n\n일반적으로, `Node.js`에선 데이터베이스에 접근하는 코드들은 블로킹을 막기 위해서 비동기로 작동하기 위해서 프로미스를 이용한다. 따라서, 당연히 `prisma` 또한 그럴 것이라고 생각한 것이었다.\n\n하지만, 아니였다.\n\n## Thenable\n\n`prisma` 에서는 단순히 JavaScript 에서 제공되는 프로미스를 이용하지 않는다.\n\n일단, `Thenable`이 뭔지 알아보자.\n\n`Thenable` 이란, then() 메서드가 있는 객체를 의미한다. 이는 프로미스와 유사하게 동작하는 객체로, 프로미스처럼 체이닝이나 `async/await` 구문에서 사용할 수 있다. 즉, 모든 프로미스는 `Thenable`이지만, 모든 `Thenable`이 프로미스인 것은 아니다.\n\n\u003e 프로미스는 ECMAScript 표준에 따라 비동기 작업의 상태 관리와 체이닝, 에러 처리 등 완전한 기능을 제공하는 객체인데, 반면 `Thenable`은 단순히 `then()` 메서드만 있는 객체이므로 그 자체로는 표준 프로미스가 아닐 수 있다.\n\n따라서, 아래 코드는 동작한다.\n\n```ts\nconst thenable = {\n  then: \u003cTResult1 = void, TResult2 = never\u003e(\n    onfulfilled?: ((value: void) =\u003e TResult1) | null,\n    onrejected?: ((reason: any) =\u003e TResult2) | null,\n  ) =\u003e {\n    console.log('thenable');\n  },\n};\n\n(async () =\u003e {\n  await thenable;\n})();\n\n// Output: \"thenable\"\n```\n\n이로 인해, 프로미스와 호환되는 객체로, 다른 라이브러리에서 제공하는 비프로미스 객체라도 `then` 메서드가 구현되어 있으면 프로미스 체인에서 사용할 수 있게 해준다.\n\n## PrismaPromise\n\n그러면, `prisma`에서는 프로미스를 어떻게 사용하고 있나 조금 더 살펴보자.\n\n```ts\nexport interface PrismaPromise\u003cTResult, TSpec extends PrismaOperationSpec\u003cunknown\u003e = any\u003e extends Promise\u003cTResult\u003e {\n  get spec(): TSpec;\n\n  then\u003cR1 = TResult, R2 = never\u003e(\n    onfulfilled?: (value: TResult) =\u003e R1 | PromiseLike\u003cR1\u003e,\n    onrejected?: (error: unknown) =\u003e R2 | PromiseLike\u003cR2\u003e,\n    transaction?: PrismaPromiseTransaction,\n  ): Promise\u003cR1 | R2\u003e;\n\n  catch\u003cR = never\u003e(\n    onrejected?: ((reason: any) =\u003e R | PromiseLike\u003cR\u003e) | undefined | null,\n    transaction?: PrismaPromiseTransaction,\n  ): Promise\u003cTResult | R\u003e;\n\n  finally(onfinally?: (() =\u003e void) | undefined | null, transaction?: PrismaPromiseTransaction): Promise\u003cTResult\u003e;\n\n  requestTransaction?(transaction: PrismaPromiseBatchTransaction): PromiseLike\u003cunknown\u003e;\n}\n```\n\n**코드에서 주석과, 일부 타입은 제거 했다.**\n\n위 코드에서 보면 알 수 있는 것은, 내부에서 사용되는 `PrismaPromise` 타입이 `Promise`를 상속받고 있다는 점과, 일부 확장한 타입에 불과하다는 것이다. 근본적으로는 프로미스다.\n\n우리가 겪었던 문제에 대한 이유는 아래 코드에서 볼 수 있다.\n\n```ts\nexport type PrismaPromiseFactory = \u003cT extends PrismaOperationSpec\u003cunknown\u003e\u003e(\n  callback: PrismaPromiseCallback,\n  op?: T,\n) =\u003e PrismaPromise\u003cunknown\u003e;\n\nexport function createPrismaPromiseFactory(transaction?: PrismaPromiseTransaction): PrismaPromiseFactory {\n  return function createPrismaPromise\u003cTSpec extends PrismaOperationSpec\u003cunknown\u003e\u003e(\n    callback: PrismaPromiseCallback,\n    op?: TSpec,\n  ): PrismaPromise\u003cunknown, TSpec\u003e {\n    let promise: PrismaPromise\u003cunknown\u003e | undefined;\n    const _callback = (callbackTransaction = transaction): PrismaPromise\u003cunknown\u003e =\u003e {\n      try {\n        if (callbackTransaction === undefined || callbackTransaction?.kind === 'itx') {\n          return (promise ??= valueToPromise(callback(callbackTransaction)));\n        }\n\n        return valueToPromise(callback(callbackTransaction));\n      } catch (error) {\n        return Promise.reject(error) as PrismaPromise\u003cunknown\u003e;\n      }\n    };\n\n    return {\n      then(onFulfilled, onRejected) {\n        return _callback().then(onFulfilled, onRejected);\n      },\n      catch(onRejected) {\n        return _callback().catch(onRejected);\n      },\n      finally(onFinally) {\n        return _callback().finally(onFinally);\n      },\n    };\n  };\n}\n```\n\n**코드가 길기 때문에, 일부 내용은 생략했다.**\n\n중요한 점은, `then`, `catch`, `finally` 3가지 메서드에서 `_callback`을 호출할 때, 작업 시점이 결졍된다는 것이다. 즉, 기존 프로미스와 다르게 바로 실행하는 것이 아닌, 지연되어 실행된다.\n\n이러한 특성으로 3가지 메서드가 호출되지 않으면 콜백이 실행되지 않고, 우리가 개발시 레코드가 생기지 않았던 이유도 지연되어 실행되는 특성으로 발생했던 문제였다.\n\n### 그래서?\n\n일단, 어떤 방식으로 실행이 되는지는 알았다.\n\n그러나, 왜 이런 방식으로 결정했을까?\n\n결과를 먼저 이야기한다면, 개발자가 실행 시점을 조절할 수 있다는 점에서 결정된 내용이다.\n\n지연 방식으로 동작하게 되면, 쿼리 객체가 바로 실행되지 않고 트랜잭션과 같은 기능 구현에 다음과 같은 방식으로 유용하게 작용한다.\n\n- 쿼리 배치 실행\n  - 여러 쿼리를 순차적으로 작성해두고, 실제 실행은 하나의 트랜잭션 내부에서 한 번에 실행할 수 있다. 예를 들어, 각각의 쿼리는 실행되지 않은 채로 존재하다가, 배열로 모아서 `prisma.$transaction([...])`와 같이 전달하면, 이 모든 쿼리가 하나의 트랜잭션 내에서 순차적으로 실행된다. 이렇게 하면 여러 개의 개별적인 데이터베이스 호출을 하나의 트랜잭션으로 묶어 실행할 수 있다.\n- 원자성 보장\n  - 트랜잭션은 여러 작업을 하나의 단위로 실행하여, 중간에 오류가 발생할 경우 전체 작업을 롤백할 수 있게 한다. lazy evaluation을 사용하면 쿼리 실행 시점을 개발자가 명시적으로 제어할 수 있으므로, 모든 쿼리가 준비된 후 한꺼번에 실행하여 트랜잭션의 원자성을 보다 쉽게 보장할 수 있다.\n- 성능 최적화\n  - 즉시 실행되는 프로미스와 달리, lazy evaluation은 여러 쿼리를 미리 구성해두고 한 번의 트랜잭션 호출로 실행하기 때문에, 데이터베이스와의 불필요한 왕복 호출을 줄여 성능 최적화에도 기여한다.\n\n## 직접 구현하기\n\n그러면, 간단하게 지연 동작하는 프로미스를 구현해보자.\n\n```ts\nclass LazyPromise\u003cT\u003e extends Promise\u003cT\u003e {\n  private promise: Promise\u003cT\u003e | null = null;\n\n  constructor(\n    private executor: (resolve: (value: T | PromiseLike\u003cT\u003e) =\u003e void, reject: (reason?: any) =\u003e void) =\u003e void,\n  ) {\n    super(() =\u003e {});\n  }\n\n  then\u003cTResult1 = T, TResult2 = never\u003e(\n    onfulfilled?: ((value: T) =\u003e TResult1 | PromiseLike\u003cTResult1\u003e) | null,\n    onrejected?: ((reason: any) =\u003e TResult2 | PromiseLike\u003cTResult2\u003e) | null,\n  ): Promise\u003cTResult1 | TResult2\u003e {\n    if (!this.promise) this.promise = new Promise(this.executor);\n    return this.promise.then(onfulfilled, onrejected);\n  }\n\n  catch\u003cTResult = never\u003e(onrejected?: ((reason: any) =\u003e TResult | PromiseLike\u003cTResult\u003e) | null): Promise\u003cT | TResult\u003e {\n    if (!this.promise) this.promise = new Promise(this.executor);\n    return this.promise.catch(onrejected);\n  }\n\n  finally(onfinally?: (() =\u003e void) | null): Promise\u003cT\u003e {\n    if (!this.promise) this.promise = new Promise(this.executor);\n    return this.promise.finally(onfinally);\n  }\n}\n```\n\n기존에 봤던 예제처럼, 특별한 기능을 요구하진 않기에 평가 시점을 개발자가 마음대로 조절할 수 있게, 지연 동작하는 프로미스를 만들어봤다.\n\n단순하게, 실행할 콜백을 전달 받고, 이를 `then`, `catch`, `finally` 메서드를 통해서 호출되면, 평가되게끔 구현했다.\n\n이는 아래와 같은 코드에서 정상 동작한다.\n\n```ts\nconst create = (data: any) =\u003e {\n  return new LazyPromise(() =\u003e {\n    console.log('create', data);\n  });\n};\n\nconst f1 = () =\u003e {\n  create('data');\n};\n\nf1();\n```\n\n`f1`을 호출하더라도, `LazyPromise`로 전달하고 있기 때문에, 우리가 겪었던 문제처럼 실제로 평가되지 않아 실행되지 않는다.\n\n```ts\nconst create = (data: any) =\u003e {\n  return new LazyPromise(() =\u003e {\n    console.log('create', data);\n  });\n};\n\nconst f1 = () =\u003e {\n  create('data').then();\n};\n\nf1();\n// Output: create data\n```\n\n하지만, 위 코드는 `then` 메서드를 이용해서 평가를 받고, 실제로 프로미스를 실행하기 때문에 동작한다.\n\n이렇게, 간단하게 지연 동작하는 프로미스를 만들어 봤다.\n\n평소엔 주로 프론트엔드를 개발하고, 백엔드를 깊게 다뤄보지도 않았고 더욱 `prisma` 같은 라이브러리는 잘 사용해보지 않았는데, 무지로 인한 신기한 경험을 하게 되었다.\n\n시점을 다루기 위해서, 프로미스를 다르게 사용하는 것에서 흥미를 느낄 수 있었고, 여러가지 다른 사례들도 살펴보면서 시야가 확장된 느낌을 받을 수 있었던 것 같다.\n\n마지막으로 `prisma`에서는 사이드 이펙트를 발생시키기 위해선, `await`, `then`, `catch`, `finally`를 사용해야한다는 점을 잊지 말자.\n\n## 참고자료\n\n- [Clarify when Prisma queries are run (PrismaPromise behavior)](https://github.com/prisma/docs/issues/800)\n- [PrismaPromise](https://github.com/prisma/prisma/blob/main/packages/client/src/runtime/core/request/PrismaPromise.ts#L32)\n- [createPrismaPromise](https://github.com/prisma/prisma/blob/38de36b93b6de7088c483b30e7d03407c29d7950/packages/client/src/runtime/core/request/createPrismaPromise.ts#L14)\n- [createLockCountPromise](https://github.com/prisma/prisma/blob/38de36b93b6de7088c483b30e7d03407c29d7950/packages/client/src/runtime/core/transaction/utils/createLockCountPromise.ts#L11_)\n"])</script><script>self.__next_f.push([1,"9:T3632,"])</script><script>self.__next_f.push([1,"\n## Zustand\n\n\u003e A small, fast, and scalable bearbones state management solution. Zustand has a comfy API based on hooks. It isn't boilerplatey or opinionated, but has enough convention to be explicit and flux-like.\n\nZustand는 위에서 적힌대로 과도한 보일러플레이트 코드가 없고 경량화되어 있는 것이 특징인 상태 관리 라이브러리이다.\n\n## Zustand - vanilla\n\nZustand의 코드를 직접 보며 특징과 어떤 식으로 구현되어있나 살펴보자.\n\n처음에, `vanilla.ts` 파일을 열게 되면 많은 타입 지정들을 볼 수 있다. 해당 내용들을 간략하게 살펴보자.\n\n### SetStateInternal\n\n```ts\ntype SetStateInternal\u003cT\u003e = {\n  _(partial: T | Partial\u003cT\u003e | { _(state: T): T | Partial\u003cT\u003e }['_'], replace?: false): void;\n  _(state: T | { _(state: T): T }['_'], replace: true): void;\n}['_'];\n```\n\n이름에서 나와있는 것처럼, 상태를 지정할 때 사용되는 타입인 것 같다. `replace`값이 어떤 값이냐에 따라 오버로딩되어 있다.\n\n`replace`가 `undefined`, `false` 와 같은 값을 가질 때면, 전체적인 상태, 또는 부분 상태, 함수형 업데이트를 통해 업데이트를 지원한다고 시그니처가 정의되어있다.\n\n반면에, `replace`가 `true`일 때는 부분 상태를 통해서 업데이트는 가능하지 않다고 정의되어있다.\n\n### StoreApi\n\n```ts\nexport interface StoreApi\u003cT\u003e {\n  setState: SetStateInternal\u003cT\u003e;\n  getState: () =\u003e T;\n  getInitialState: () =\u003e T;\n  subscribe: (listener: (state: T, prevState: T) =\u003e void) =\u003e () =\u003e void;\n}\n```\n\n그리고 `StoreApi` 인터페이스는 Zustand store의 핵심 API들을 정의하고 있다.\n\n- `setState`: 앞서 살펴본 타입대로 상태를 업데이트하는 함수\n- `getState`: 현재 상태를 반환하는 함수\n- `getInitialState`: 초기 상태를 반환하는 함수\n- `subscribe`: 상태 변화를 구독할 수 있는 함수로, 상태가 변경될 때마다 리스너가 호출되며 현재 상태와 이전 상태를 매개변수로 받는다. 구독을 해제하는 함수를 반환한다.\n\n이러한 API들을 통해 Zustand는 단순하면서도 효과적인 상태 관리를 가능하게 한다.\n\n### ExtractState, Get\n\n```ts\nexport type ExtractState\u003cS\u003e = S extends { getState: () =\u003e infer T } ? T : never;\n\ntype Get\u003cT, K, F\u003e = K extends keyof T ? T[K] : F;\n```\n\n`ExtractState`타입은 스토어에서 상태의 타입을 추출하는데 사용된다.\n\n`Get`타입은 `T`에서 `K`를 키로 가지는 값을 추출하는데 사용하는데 사용된다. 만약 추출할 수 없다면, `F` 타입으로 fallback 값이 설정되어 있다.\n\n### StoreMutators, StoreMutatorIdentifier\n\n```ts\nexport interface StoreMutators\u003cS, A\u003e {}\nexport type StoreMutatorIdentifier = keyof StoreMutators\u003cunknown, unknown\u003e;\n```\n\n`StoreMutators`는 스토어 변경자(mutator)를 정의하는 인터페이스이다. 제네릭 타입 `S`는 스토어의 상태 타입을, `A`는 액션의 타입을 나타낸다. 이 인터페이스를 통해 스토어의 상태를 변경하는 다양한 mutator들을 정의할 수 있다.\n\n### Mutate\n\n```ts\nexport type Mutate\u003cS, Ms\u003e = number extends Ms['length' \u0026 keyof Ms]\n  ? S\n  : Ms extends []\n    ? S\n    : Ms extends [[infer Mi, infer Ma], ...infer Mrs]\n      ? Mutate\u003cStoreMutators\u003cS, Ma\u003e[Mi \u0026 StoreMutatorIdentifier], Mrs\u003e\n      : never;\n```\n\n`Mutate` 타입은 스토어의 타입 변형을 다루기 위한 복잡한 타입 시스템을 구현한다. 여기서는 재귀적인 타입 변환을 수행한다\n\n1. 만약 `Ms`의 길이가 number 타입으로 확장 가능하다면(길이를 알 수 없는 경우), 원본 상태 `S`를 반환\n2. 만약 `Ms`가 empty array라면, 원본 상태 `S`를 반환\n3. `Ms`가 mutator 튜플 배열이라면, 각 mutator를 순차적으로 적용\n4. 각 mutator는 `[identifier, configuration]` 형태의 튜플로 구성\n5. 재귀적으로 각 mutator를 적용하여 최종 상태 타입을 생성\n\n이 타입은 Zustand의 미들웨어와 같은 스토어 변형을 타입 안전하게 처리하는데 사용된다.\n\n### StateCreator\n\n```ts\nexport type StateCreator\u003c\n  T,\n  Mis extends [StoreMutatorIdentifier, unknown][] = [],\n  Mos extends [StoreMutatorIdentifier, unknown][] = [],\n  U = T,\n\u003e = ((\n  setState: Get\u003cMutate\u003cStoreApi\u003cT\u003e, Mis\u003e, 'setState', never\u003e,\n  getState: Get\u003cMutate\u003cStoreApi\u003cT\u003e, Mis\u003e, 'getState', never\u003e,\n  store: Mutate\u003cStoreApi\u003cT\u003e, Mis\u003e,\n) =\u003e U) \u0026 { $$storeMutators?: Mos };\n```\n\n`StateCreator` 타입은 Zustand 스토어를 생성할 때 사용되는 핵심 타입이다.\n\nT(상태), Mis(입력 뮤테이터), Mos(출력 뮤테이터), U(반환 타입) 같은 제네릭으로 상태와 미들웨어 적용을 타입 안전하게 구성할 수 있다.\n\n생성 함수에서 `setState`, `getState` 등을 받아 원하는 형태의 상태를 반환하는 구조로 설계되어 있다.\n\n### CreateStore, CreateStoreImpl\n\n```ts\ntype CreateStore = {\n  \u003cT, Mos extends [StoreMutatorIdentifier, unknown][] = []\u003e(\n    initializer: StateCreator\u003cT, [], Mos\u003e,\n  ): Mutate\u003cStoreApi\u003cT\u003e, Mos\u003e;\n\n  \u003cT\u003e(): \u003cMos extends [StoreMutatorIdentifier, unknown][] = []\u003e(\n    initializer: StateCreator\u003cT, [], Mos\u003e,\n  ) =\u003e Mutate\u003cStoreApi\u003cT\u003e, Mos\u003e;\n};\n\ntype CreateStoreImpl = \u003cT, Mos extends [StoreMutatorIdentifier, unknown][] = []\u003e(\n  initializer: StateCreator\u003cT, [], Mos\u003e,\n) =\u003e Mutate\u003cStoreApi\u003cT\u003e, Mos\u003e;\n```\n\n`CreateStore` 타입은 오버로드된 함수 타입을 정의하고 있다. 두 가지의 호출 방식을 지원하고 있다.\n\n1. 직접 호출 방식\n2. 커링 방식\n\n`CreateStoreImpl` 타입은 실제 구현에 사용되는 단일 시그니처 타입이다. CreateStore의 첫 번째 오버로드와 동일한 시그니처를 가진다.\n\n이러한 방식으로 두 가지 타입이 선언된 이유는 실제 구현을 보면 알 수 있다.\n\n### createStoreImpl\n\n```ts\nconst createStoreImpl: CreateStoreImpl = (createState) =\u003e {\n  type TState = ReturnType\u003ctypeof createState\u003e;\n  type Listener = (state: TState, prevState: TState) =\u003e void;\n  let state: TState;\n  const listeners: Set\u003cListener\u003e = new Set();\n\n  const setState: StoreApi\u003cTState\u003e['setState'] = (partial, replace) =\u003e {\n    const nextState = typeof partial === 'function' ? (partial as (state: TState) =\u003e TState)(state) : partial;\n    if (!Object.is(nextState, state)) {\n      const previousState = state;\n      state =\n        (replace ?? (typeof nextState !== 'object' || nextState === null))\n          ? (nextState as TState)\n          : Object.assign({}, state, nextState);\n      listeners.forEach((listener) =\u003e listener(state, previousState));\n    }\n  };\n\n  const getState: StoreApi\u003cTState\u003e['getState'] = () =\u003e state;\n\n  const getInitialState: StoreApi\u003cTState\u003e['getInitialState'] = () =\u003e initialState;\n\n  const subscribe: StoreApi\u003cTState\u003e['subscribe'] = (listener) =\u003e {\n    listeners.add(listener);\n    // Unsubscribe\n    return () =\u003e listeners.delete(listener);\n  };\n\n  const api = { setState, getState, getInitialState, subscribe };\n  const initialState = (state = createState(setState, getState, api));\n  return api as any;\n};\n```\n\n이 부분이 상태 관리 스토어를 구현하는 핵심 함수이다.\n\n`state`라는 변수로 현재 상태를 저장하고, `listeners`변수에 상태 변경에 대해 구독하고 있는 함수들을 따로 관리하고 있다.\n\n```ts\n  const setState: StoreApi\u003cTState\u003e['setState'] = (partial, replace) =\u003e {\n    const nextState =\n      typeof partial === 'function'\n        ? (partial as (state: TState) =\u003e TState)(state)\n        : partial\n```\n\n`setState` 함수는 새로운 상태를 설정하는 함수이다. 함수나 값을 받아서 상태를 업데이트할 수 있다. `partial`이 함수면 현재 상태를 인자로 실행하고, 아니면 값 그대로 사용한다.\n\n여기에서 상태 업데이트 로직을 살펴보자.\n\n```ts\nif (!Object.is(nextState, state)) {\n  const previousState = state;\n  state =\n    (replace ?? (typeof nextState !== 'object' || nextState === null))\n      ? (nextState as TState)\n      : Object.assign({}, state, nextState);\n  listeners.forEach((listener) =\u003e listener(state, previousState));\n}\n```\n\n새 상태가 현재 상태와 다른 경우에만 업데이트를 수행한다. `replace` 옵션이 `true`이거나 새 상태가 객체가 아닐 경우 완전히 대체한다. 객체인 경우 얕은 병합을 수행한다. 상태가 변경되면 모든 리스너에게 새 상태와 이전 상태를 전달한다.\n\n새 상태와 현재 상태를 비교하는 것은 `Object.is` 함수를 이용해서 하게 되는데, 비교 기준은 아래 문서에 자세하게 기술되어 있다.\n\n- [Object.is - MDN](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/is)\n\n```ts\nconst getState: StoreApi\u003cTState\u003e['getState'] = () =\u003e state;\n\nconst getInitialState: StoreApi\u003cTState\u003e['getInitialState'] = () =\u003e initialState;\n\nconst subscribe: StoreApi\u003cTState\u003e['subscribe'] = (listener) =\u003e {\n  listeners.add(listener);\n  // Unsubscribe\n  return () =\u003e listeners.delete(listener);\n};\n```\n\n그 외 아래 유틸리티 메서드들은 아주 쉽게 구현되어 있다.\n\n- `getState`: 현재 상태를 반환\n- `getInitialState`: 초기 상태를 반환\n- `subscribe`: 리스너를 등록하고 구독 해제 함수를 반환\n\n```ts\nconst api = { setState, getState, getInitialState, subscribe };\nconst initialState = (state = createState(setState, getState, api));\n```\n\n이후에 API 객체를 생성, 초기 상태를 설정하고 스토어 API를 반환한다.\n\n이 구현은 상태 관리의 핵심 패턴인 pub/sub 패턴을 사용하며, 불변성을 유지하면서 상태를 업데이트하는 안전한 방법을 제공한다.\n\n또한, `state` 변수를 클로저로 캡슐화하여 외부에서 직접 접근 불가능하게 상태 관리하였다.\n\n따라서 `getState`, `setState` 등이 클로저를 통해 상태를 관리할 수 있도록 API를 제공하고 있다.\n\n### createStore\n\n```ts\nexport const createStore = ((createState) =\u003e\n  createState ? createStoreImpl(createState) : createStoreImpl) as CreateStore;\n```\n\n결과적으로 해당 스토어를 생성하는 `createStoreImpl`함수를 위에서 언급한 두 가지 방법으로 제공하게 된다. (직접 실행, 커링)\n\n## Zustand - React\n\nZustand는 위에서 본 것처럼 특정 프레임워크나, 라이브러리 위에서만 동작되는 라이브러리가 아니다.\n\n그렇지만, 흔히 사용되는 리액트에서 쉽게 사용할 수 있도록 유틸리티를 제공하는데 이에 대해 살펴보자.\n\n### useStore\n\n```ts\nexport function useStore\u003cS extends ReadonlyStoreApi\u003cunknown\u003e\u003e(api: S): ExtractState\u003cS\u003e;\n\nexport function useStore\u003cS extends ReadonlyStoreApi\u003cunknown\u003e, U\u003e(api: S, selector: (state: ExtractState\u003cS\u003e) =\u003e U): U;\n\nexport function useStore\u003cTState, StateSlice\u003e(\n  api: ReadonlyStoreApi\u003cTState\u003e,\n  selector: (state: TState) =\u003e StateSlice = identity as any,\n) {\n  const slice = React.useSyncExternalStore(\n    api.subscribe,\n    () =\u003e selector(api.getState()),\n    () =\u003e selector(api.getInitialState()),\n  );\n  React.useDebugValue(slice);\n  return slice;\n}\n```\n\nZustand에서 `useStore`라는 훅을 제공하는데, 2가지의 함수 오버로드가 있다.\n\n1. 전체 상태를 반환\n2. `selector`를 통해서 선택된 상태를 반환\n\n이후에 아래 실제 구현 내용을 보면, `React.useSyncExternalStore`라는 함수를 통해서 리액트와 상호작용을 하게 된다는 것을 볼 수 있다.\n\n`React.useSyncExternalStore` 함수에 대해선 아래 내용을 참고하자.\n\n- [React.useSyncExternalStore](https://ko.react.dev/reference/react/useSyncExternalStore)\n\n이를 통해서 스토어의 변경에 대해 반응하게 되어, 렌더링을 진행하게 된다.\n\n이제, 이를 통해서 스토어를 생성하는 것에 대해서 더 살펴보자.\n\n### UseBoundStore\n\n```ts\nexport type UseBoundStore\u003cS extends ReadonlyStoreApi\u003cunknown\u003e\u003e = {\n  (): ExtractState\u003cS\u003e;\n  \u003cU\u003e(selector: (state: ExtractState\u003cS\u003e) =\u003e U): U;\n} \u0026 S;\n```\n\n이 타입은 아래 내용들을 결합한 상태를 나타낸다.\n\n1. 전체 상태를 반환하는 함수\n2. 선택자를 통한 부분 상태 접근\n3. 스토어 API 메서드들\n\n### Create\n\n```ts\ntype Create = {\n  \u003cT, Mos extends [StoreMutatorIdentifier, unknown][] = []\u003e(\n    initializer: StateCreator\u003cT, [], Mos\u003e,\n  ): UseBoundStore\u003cMutate\u003cStoreApi\u003cT\u003e, Mos\u003e\u003e;\n  \u003cT\u003e(): \u003cMos extends [StoreMutatorIdentifier, unknown][] = []\u003e(\n    initializer: StateCreator\u003cT, [], Mos\u003e,\n  ) =\u003e UseBoundStore\u003cMutate\u003cStoreApi\u003cT\u003e, Mos\u003e\u003e;\n};\n```\n\n스토어 생성을 하는 함수를 구현하기 전에 앞서, 타입을 정의하고 있는데 이전과 같이 두 가지 시그니처를 제공하고 있다.\n\n1. 직접 초기화\n2. 커링된 초기화\n\n### createImpl, create\n\n```ts\nconst createImpl = \u003cT\u003e(createState: StateCreator\u003cT, [], []\u003e) =\u003e {\n  const api = createStore(createState);\n\n  const useBoundStore: any = (selector?: any) =\u003e useStore(api, selector);\n\n  Object.assign(useBoundStore, api);\n\n  return useBoundStore;\n};\n\nexport const create = (\u003cT\u003e(createState: StateCreator\u003cT, [], []\u003e | undefined) =\u003e\n  createState ? createImpl(createState) : createImpl) as Create;\n```\n\n`vanilla.ts` 파일에서 볼 수 있었던 `createStore` 함수를 이용해서 스토어를 생성하고, `useStore` 훅을 연결한다.\n\n이를 이용해서 두 가지 오버로드된 시그니처 타입을 제공하는 `create` 함수를 통해서 스토어를 생성하고 `useStore` 훅을 통해서 리액트와 연결하여 사용할 수 있게 된다.\n\n## 마지막\n\nZustand는 간단하면서도 유연한 API로 상태를 관리하며, 내부적으로 pub/sub 패턴과 불변 상태 업데이트 로직을 사용해 상태 관리를 제공한다. 또한, 리액트의 `useSyncExternalStore` 훅을 통해서 리액트에서의 렌더링을 제공하고 있다.\n"])</script><script>self.__next_f.push([1,"0:{\"P\":null,\"b\":\"UaSPrdIBBgy_3LFCVqc7R\",\"p\":\"\",\"c\":[\"\",\"_not-found\",\"\"],\"i\":false,\"f\":[[[\"\",{\"children\":[\"/_not-found\",{\"children\":[\"__PAGE__\",{}]}]},\"$undefined\",\"$undefined\",true],[\"\",[\"$\",\"$1\",\"c\",{\"children\":[[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/css/6d80bd2ed1c3a2f8.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]],[\"$\",\"html\",null,{\
