\"static/chunks/app/layout-79922a36488755ed.js\"],\"default\"]\na:I[9165,[],\"OutletBoundary\"]\nc:I[9165,[],\"MetadataBoundary\"]\ne:I[9165,[],\"ViewportBoundary\"]\n10:I[5339,[],\"\"]\n:HL[\"/_next/static/media/a34f9d1faa5f3315-s.p.woff2\",\"font\",{\"crossOrigin\":\"\",\"type\":\"font/woff2\"}]\n:HL[\"/_next/static/css/9810bca93e0e7d6c.css\",\"style\"]\n5:T2ad3,"])</script><script>self.__next_f.push([1,"\n팀원들과 함께 개발하던 중, 특이한 현상을 발견했다.\n백엔드에서 ORM으로 `prisma`를 사용하고 있는 상황이였다. `repository` 레이어에서 데이터베이스에 레코드를 생성하기 위해서 아래 같이 코드를 작성했다.\n\n```ts\n// 예시 코드\ncreate(dto: DTO) {\n  this.prisma.table.create({ data: dto });\n}\n```\n\n큰 고민 없이, 데이터베이스에 접근하는 코드에서 그 이후에 특별히 해야하는 것이 없어서, `async/await` 키워드를 사용하지 않았고, 프로미스의 메서드들을 이용하지도 않았다.\n\n이후에 테스트를 진행하여, API를 호출하니 실제로 레코드가 생기지 않는 것을 확인할 수 있었다. 어떠한 이유였을까?\n\n이런 저런 이유를 알아보기 위해서 많은 테스트를 했지만 결과적으로 알아낸 것은, `await`, `then`, `catch`, `finally` 와 같은 키워드, 메서드를 이용해서 호출하지 않으면 실행되지 않는다는 것을 발견했다.\n\n즉, 아래와 같은 형태는 정상적으로 실행이 된다.\n\n```ts\ncreate(dto: DTO) {\n  this.prisma.table.create({ data: dto }).then();\n}\n```\n\n일반적으로, `Node.js`에선 데이터베이스에 접근하는 코드들은 블로킹을 막기 위해서 비동기로 작동하기 위해서 프로미스를 이용한다. 따라서, 당연히 `prisma` 또한 그럴 것이라고 생각한 것이었다.\n\n하지만, 아니였다.\n\n## Thenable\n\n`prisma` 에서는 단순히 JavaScript 에서 제공되는 프로미스를 이용하지 않는다.\n\n일단, `Thenable`이 뭔지 알아보자.\n\n`Thenable` 이란, then() 메서드가 있는 객체를 의미한다. 이는 프로미스와 유사하게 동작하는 객체로, 프로미스처럼 체이닝이나 `async/await` 구문에서 사용할 수 있다. 즉, 모든 프로미스는 `Thenable`이지만, 모든 `Thenable`이 프로미스인 것은 아니다.\n\n\u003e 프로미스는 ECMAScript 표준에 따라 비동기 작업의 상태 관리와 체이닝, 에러 처리 등 완전한 기능을 제공하는 객체인데, 반면 `Thenable`은 단순히 `then()` 메서드만 있는 객체이므로 그 자체로는 표준 프로미스가 아닐 수 있다.\n\n따라서, 아래 코드는 동작한다.\n\n```ts\nconst thenable = {\n  then: \u003cTResult1 = void, TResult2 = never\u003e(\n    onfulfilled?: ((value: void) =\u003e TResult1) | null,\n    onrejected?: ((reason: any) =\u003e TResult2) | null,\n  ) =\u003e {\n    console.log('thenable');\n  },\n};\n\n(async () =\u003e {\n  await thenable;\n})();\n\n// Output: \"thenable\"\n```\n\n이로 인해, 프로미스와 호환되는 객체로, 다른 라이브러리에서 제공하는 비프로미스 객체라도 `then` 메서드가 구현되어 있으면 프로미스 체인에서 사용할 수 있게 해준다.\n\n## PrismaPromise\n\n그러면, `prisma`에서는 프로미스를 어떻게 사용하고 있나 조금 더 살펴보자.\n\n```ts\nexport interface PrismaPromise\u003cTResult, TSpec extends PrismaOperationSpec\u003cunknown\u003e = any\u003e extends Promise\u003cTResult\u003e {\n  get spec(): TSpec;\n\n  then\u003cR1 = TResult, R2 = never\u003e(\n    onfulfilled?: (value: TResult) =\u003e R1 | PromiseLike\u003cR1\u003e,\n    onrejected?: (error: unknown) =\u003e R2 | PromiseLike\u003cR2\u003e,\n    transaction?: PrismaPromiseTransaction,\n  ): Promise\u003cR1 | R2\u003e;\n\n  catch\u003cR = never\u003e(\n    onrejected?: ((reason: any) =\u003e R | PromiseLike\u003cR\u003e) | undefined | null,\n    transaction?: PrismaPromiseTransaction,\n  ): Promise\u003cTResult | R\u003e;\n\n  finally(onfinally?: (() =\u003e void) | undefined | null, transaction?: PrismaPromiseTransaction): Promise\u003cTResult\u003e;\n\n  requestTransaction?(transaction: PrismaPromiseBatchTransaction): PromiseLike\u003cunknown\u003e;\n}\n```\n\n**코드에서 주석과, 일부 타입은 제거 했다.**\n\n위 코드에서 보면 알 수 있는 것은, 내부에서 사용되는 `PrismaPromise` 타입이 `Promise`를 상속받고 있다는 점과, 일부 확장한 타입에 불과하다는 것이다. 근본적으로는 프로미스다.\n\n우리가 겪었던 문제에 대한 이유는 아래 코드에서 볼 수 있다.\n\n```ts\nexport type PrismaPromiseFactory = \u003cT extends PrismaOperationSpec\u003cunknown\u003e\u003e(\n  callback: PrismaPromiseCallback,\n  op?: T,\n) =\u003e PrismaPromise\u003cunknown\u003e;\n\nexport function createPrismaPromiseFactory(transaction?: PrismaPromiseTransaction): PrismaPromiseFactory {\n  return function createPrismaPromise\u003cTSpec extends PrismaOperationSpec\u003cunknown\u003e\u003e(\n    callback: PrismaPromiseCallback,\n    op?: TSpec,\n  ): PrismaPromise\u003cunknown, TSpec\u003e {\n    let promise: PrismaPromise\u003cunknown\u003e | undefined;\n    const _callback = (callbackTransaction = transaction): PrismaPromise\u003cunknown\u003e =\u003e {\n      try {\n        if (callbackTransaction === undefined || callbackTransaction?.kind === 'itx') {\n          return (promise ??= valueToPromise(callback(callbackTransaction)));\n        }\n\n        return valueToPromise(callback(callbackTransaction));\n      } catch (error) {\n        return Promise.reject(error) as PrismaPromise\u003cunknown\u003e;\n      }\n    };\n\n    return {\n      then(onFulfilled, onRejected) {\n        return _callback().then(onFulfilled, onRejected);\n      },\n      catch(onRejected) {\n        return _callback().catch(onRejected);\n      },\n      finally(onFinally) {\n        return _callback().finally(onFinally);\n      },\n    };\n  };\n}\n```\n\n**코드가 길기 때문에, 일부 내용은 생략했다.**\n\n중요한 점은, `then`, `catch`, `finally` 3가지 메서드에서 `_callback`을 호출할 때, 작업 시점이 결졍된다는 것이다. 즉, 기존 프로미스와 다르게 바로 실행하는 것이 아닌, 지연되어 실행된다.\n\n이러한 특성으로 3가지 메서드가 호출되지 않으면 콜백이 실행되지 않고, 우리가 개발시 레코드가 생기지 않았던 이유도 지연되어 실행되는 특성으로 발생했던 문제였다.\n\n### 그래서?\n\n일단, 어떤 방식으로 실행이 되는지는 알았다.\n\n그러나, 왜 이런 방식으로 결정했을까?\n\n결과를 먼저 이야기한다면, 개발자가 실행 시점을 조절할 수 있다는 점에서 결정된 내용이다.\n\n지연 방식으로 동작하게 되면, 쿼리 객체가 바로 실행되지 않고 트랜잭션과 같은 기능 구현에 다음과 같은 방식으로 유용하게 작용한다.\n\n- 쿼리 배치 실행\n  - 여러 쿼리를 순차적으로 작성해두고, 실제 실행은 하나의 트랜잭션 내부에서 한 번에 실행할 수 있다. 예를 들어, 각각의 쿼리는 실행되지 않은 채로 존재하다가, 배열로 모아서 `prisma.$transaction([...])`와 같이 전달하면, 이 모든 쿼리가 하나의 트랜잭션 내에서 순차적으로 실행된다. 이렇게 하면 여러 개의 개별적인 데이터베이스 호출을 하나의 트랜잭션으로 묶어 실행할 수 있다.\n- 원자성 보장\n  - 트랜잭션은 여러 작업을 하나의 단위로 실행하여, 중간에 오류가 발생할 경우 전체 작업을 롤백할 수 있게 한다. lazy evaluation을 사용하면 쿼리 실행 시점을 개발자가 명시적으로 제어할 수 있으므로, 모든 쿼리가 준비된 후 한꺼번에 실행하여 트랜잭션의 원자성을 보다 쉽게 보장할 수 있다.\n- 성능 최적화\n  - 즉시 실행되는 프로미스와 달리, lazy evaluation은 여러 쿼리를 미리 구성해두고 한 번의 트랜잭션 호출로 실행하기 때문에, 데이터베이스와의 불필요한 왕복 호출을 줄여 성능 최적화에도 기여한다.\n\n## 직접 구현하기\n\n그러면, 간단하게 지연 동작하는 프로미스를 구현해보자.\n\n```ts\nclass LazyPromise\u003cT\u003e extends Promise\u003cT\u003e {\n  private promise: Promise\u003cT\u003e | null = null;\n\n  constructor(\n    private executor: (resolve: (value: T | PromiseLike\u003cT\u003e) =\u003e void, reject: (reason?: any) =\u003e void) =\u003e void,\n  ) {\n    super(() =\u003e {});\n  }\n\n  then\u003cTResult1 = T, TResult2 = never\u003e(\n    onfulfilled?: ((value: T) =\u003e TResult1 | PromiseLike\u003cTResult1\u003e) | null,\n    onrejected?: ((reason: any) =\u003e TResult2 | PromiseLike\u003cTResult2\u003e) | null,\n  ): Promise\u003cTResult1 | TResult2\u003e {\n    if (!this.promise) this.promise = new Promise(this.executor);\n    return this.promise.then(onfulfilled, onrejected);\n  }\n\n  catch\u003cTResult = never\u003e(onrejected?: ((reason: any) =\u003e TResult | PromiseLike\u003cTResult\u003e) | null): Promise\u003cT | TResult\u003e {\n    if (!this.promise) this.promise = new Promise(this.executor);\n    return this.promise.catch(onrejected);\n  }\n\n  finally(onfinally?: (() =\u003e void) | null): Promise\u003cT\u003e {\n    if (!this.promise) this.promise = new Promise(this.executor);\n    return this.promise.finally(onfinally);\n  }\n}\n```\n\n기존에 봤던 예제처럼, 특별한 기능을 요구하진 않기에 평가 시점을 개발자가 마음대로 조절할 수 있게, 지연 동작하는 프로미스를 만들어봤다.\n\n단순하게, 실행할 콜백을 전달 받고, 이를 `then`, `catch`, `finally` 메서드를 통해서 호출되면, 평가되게끔 구현했다.\n\n이는 아래와 같은 코드에서 정상 동작한다.\n\n```ts\nconst create = (data: any) =\u003e {\n  return new LazyPromise(() =\u003e {\n    console.log('create', data);\n  });\n};\n\nconst f1 = () =\u003e {\n  create('data');\n};\n\nf1();\n```\n\n`f1`을 호출하더라도, `LazyPromise`로 전달하고 있기 때문에, 우리가 겪었던 문제처럼 실제로 평가되지 않아 실행되지 않는다.\n\n```ts\nconst create = (data: any) =\u003e {\n  return new LazyPromise(() =\u003e {\n    console.log('create', data);\n  });\n};\n\nconst f1 = () =\u003e {\n  create('data').then();\n};\n\nf1();\n// Output: create data\n```\n\n하지만, 위 코드는 `then` 메서드를 이용해서 평가를 받고, 실제로 프로미스를 실행하기 때문에 동작한다.\n\n이렇게, 간단하게 지연 동작하는 프로미스를 만들어 봤다.\n\n평소엔 주로 프론트엔드를 개발하고, 백엔드를 깊게 다뤄보지도 않았고 더욱 `prisma` 같은 라이브러리는 잘 사용해보지 않았는데, 무지로 인한 신기한 경험을 하게 되었다.\n\n시점을 다루기 위해서, 프로미스를 다르게 사용하는 것에서 흥미를 느낄 수 있었고, 여러가지 다른 사례들도 살펴보면서 시야가 확장된 느낌을 받을 수 있었던 것 같다.\n\n마지막으로 `prisma`에서는 사이드 이펙트를 발생시키기 위해선, `await`, `then`, `catch`, `finally`를 사용해야한다는 점을 잊지 말자.\n\n## 참고자료\n\n- [Clarify when Prisma queries are run (PrismaPromise behavior)](https://github.com/prisma/docs/issues/800)\n- [PrismaPromise](https://github.com/prisma/prisma/blob/main/packages/client/src/runtime/core/request/PrismaPromise.ts#L32)\n- [createPrismaPromise](https://github.com/prisma/prisma/blob/38de36b93b6de7088c483b30e7d03407c29d7950/packages/client/src/runtime/core/request/createPrismaPromise.ts#L14)\n- [createLockCountPromise](https://github.com/prisma/prisma/blob/38de36b93b6de7088c483b30e7d03407c29d7950/packages/client/src/runtime/core/transaction/utils/createLockCountPromise.ts#L11_)\n"])</script><script>self.__next_f.push([1,"6:T3632,"])</script><script>self.__next_f.push([1,"\n## Zustand\n\n\u003e A small, fast, and scalable bearbones state management solution. Zustand has a comfy API based on hooks. It isn't boilerplatey or opinionated, but has enough convention to be explicit and flux-like.\n\nZustand는 위에서 적힌대로 과도한 보일러플레이트 코드가 없고 경량화되어 있는 것이 특징인 상태 관리 라이브러리이다.\n\n## Zustand - vanilla\n\nZustand의 코드를 직접 보며 특징과 어떤 식으로 구현되어있나 살펴보자.\n\n처음에, `vanilla.ts` 파일을 열게 되면 많은 타입 지정들을 볼 수 있다. 해당 내용들을 간략하게 살펴보자.\n\n### SetStateInternal\n\n```ts\ntype SetStateInternal\u003cT\u003e = {\n  _(partial: T | Partial\u003cT\u003e | { _(state: T): T | Partial\u003cT\u003e }['_'], replace?: false): void;\n  _(state: T | { _(state: T): T }['_'], replace: true): void;\n}['_'];\n```\n\n이름에서 나와있는 것처럼, 상태를 지정할 때 사용되는 타입인 것 같다. `replace`값이 어떤 값이냐에 따라 오버로딩되어 있다.\n\n`replace`가 `undefined`, `false` 와 같은 값을 가질 때면, 전체적인 상태, 또는 부분 상태, 함수형 업데이트를 통해 업데이트를 지원한다고 시그니처가 정의되어있다.\n\n반면에, `replace`가 `true`일 때는 부분 상태를 통해서 업데이트는 가능하지 않다고 정의되어있다.\n\n### StoreApi\n\n```ts\nexport interface StoreApi\u003cT\u003e {\n  setState: SetStateInternal\u003cT\u003e;\n  getState: () =\u003e T;\n  getInitialState: () =\u003e T;\n  subscribe: (listener: (state: T, prevState: T) =\u003e void) =\u003e () =\u003e void;\n}\n```\n\n그리고 `StoreApi` 인터페이스는 Zustand store의 핵심 API들을 정의하고 있다.\n\n- `setState`: 앞서 살펴본 타입대로 상태를 업데이트하는 함수\n- `getState`: 현재 상태를 반환하는 함수\n- `getInitialState`: 초기 상태를 반환하는 함수\n- `subscribe`: 상태 변화를 구독할 수 있는 함수로, 상태가 변경될 때마다 리스너가 호출되며 현재 상태와 이전 상태를 매개변수로 받는다. 구독을 해제하는 함수를 반환한다.\n\n이러한 API들을 통해 Zustand는 단순하면서도 효과적인 상태 관리를 가능하게 한다.\n\n### ExtractState, Get\n\n```ts\nexport type ExtractState\u003cS\u003e = S extends { getState: () =\u003e infer T } ? T : never;\n\ntype Get\u003cT, K, F\u003e = K extends keyof T ? T[K] : F;\n```\n\n`ExtractState`타입은 스토어에서 상태의 타입을 추출하는데 사용된다.\n\n`Get`타입은 `T`에서 `K`를 키로 가지는 값을 추출하는데 사용하는데 사용된다. 만약 추출할 수 없다면, `F` 타입으로 fallback 값이 설정되어 있다.\n\n### StoreMutators, StoreMutatorIdentifier\n\n```ts\nexport interface StoreMutators\u003cS, A\u003e {}\nexport type StoreMutatorIdentifier = keyof StoreMutators\u003cunknown, unknown\u003e;\n```\n\n`StoreMutators`는 스토어 변경자(mutator)를 정의하는 인터페이스이다. 제네릭 타입 `S`는 스토어의 상태 타입을, `A`는 액션의 타입을 나타낸다. 이 인터페이스를 통해 스토어의 상태를 변경하는 다양한 mutator들을 정의할 수 있다.\n\n### Mutate\n\n```ts\nexport type Mutate\u003cS, Ms\u003e = number extends Ms['length' \u0026 keyof Ms]\n  ? S\n  : Ms extends []\n    ? S\n    : Ms extends [[infer Mi, infer Ma], ...infer Mrs]\n      ? Mutate\u003cStoreMutators\u003cS, Ma\u003e[Mi \u0026 StoreMutatorIdentifier], Mrs\u003e\n      : never;\n```\n\n`Mutate` 타입은 스토어의 타입 변형을 다루기 위한 복잡한 타입 시스템을 구현한다. 여기서는 재귀적인 타입 변환을 수행한다\n\n1. 만약 `Ms`의 길이가 number 타입으로 확장 가능하다면(길이를 알 수 없는 경우), 원본 상태 `S`를 반환\n2. 만약 `Ms`가 empty array라면, 원본 상태 `S`를 반환\n3. `Ms`가 mutator 튜플 배열이라면, 각 mutator를 순차적으로 적용\n4. 각 mutator는 `[identifier, configuration]` 형태의 튜플로 구성\n5. 재귀적으로 각 mutator를 적용하여 최종 상태 타입을 생성\n\n이 타입은 Zustand의 미들웨어와 같은 스토어 변형을 타입 안전하게 처리하는데 사용된다.\n\n### StateCreator\n\n```ts\nexport type StateCreator\u003c\n  T,\n  Mis extends [StoreMutatorIdentifier, unknown][] = [],\n  Mos extends [StoreMutatorIdentifier, unknown][] = [],\n  U = T,\n\u003e = ((\n  setState: Get\u003cMutate\u003cStoreApi\u003cT\u003e, Mis\u003e, 'setState', never\u003e,\n  getState: Get\u003cMutate\u003cStoreApi\u003cT\u003e, Mis\u003e, 'getState', never\u003e,\n  store: Mutate\u003cStoreApi\u003cT\u003e, Mis\u003e,\n) =\u003e U) \u0026 { $$storeMutators?: Mos };\n```\n\n`StateCreator` 타입은 Zustand 스토어를 생성할 때 사용되는 핵심 타입이다.\n\nT(상태), Mis(입력 뮤테이터), Mos(출력 뮤테이터), U(반환 타입) 같은 제네릭으로 상태와 미들웨어 적용을 타입 안전하게 구성할 수 있다.\n\n생성 함수에서 `setState`, `getState` 등을 받아 원하는 형태의 상태를 반환하는 구조로 설계되어 있다.\n\n### CreateStore, CreateStoreImpl\n\n```ts\ntype CreateStore = {\n  \u003cT, Mos extends [StoreMutatorIdentifier, unknown][] = []\u003e(\n    initializer: StateCreator\u003cT, [], Mos\u003e,\n  ): Mutate\u003cStoreApi\u003cT\u003e, Mos\u003e;\n\n  \u003cT\u003e(): \u003cMos extends [StoreMutatorIdentifier, unknown][] = []\u003e(\n    initializer: StateCreator\u003cT, [], Mos\u003e,\n  ) =\u003e Mutate\u003cStoreApi\u003cT\u003e, Mos\u003e;\n};\n\ntype CreateStoreImpl = \u003cT, Mos extends [StoreMutatorIdentifier, unknown][] = []\u003e(\n  initializer: StateCreator\u003cT, [], Mos\u003e,\n) =\u003e Mutate\u003cStoreApi\u003cT\u003e, Mos\u003e;\n```\n\n`CreateStore` 타입은 오버로드된 함수 타입을 정의하고 있다. 두 가지의 호출 방식을 지원하고 있다.\n\n1. 직접 호출 방식\n2. 커링 방식\n\n`CreateStoreImpl` 타입은 실제 구현에 사용되는 단일 시그니처 타입이다. CreateStore의 첫 번째 오버로드와 동일한 시그니처를 가진다.\n\n이러한 방식으로 두 가지 타입이 선언된 이유는 실제 구현을 보면 알 수 있다.\n\n### createStoreImpl\n\n```ts\nconst createStoreImpl: CreateStoreImpl = (createState) =\u003e {\n  type TState = ReturnType\u003ctypeof createState\u003e;\n  type Listener = (state: TState, prevState: TState) =\u003e void;\n  let state: TState;\n  const listeners: Set\u003cListener\u003e = new Set();\n\n  const setState: StoreApi\u003cTState\u003e['setState'] = (partial, replace) =\u003e {\n    const nextState = typeof partial === 'function' ? (partial as (state: TState) =\u003e TState)(state) : partial;\n    if (!Object.is(nextState, state)) {\n      const previousState = state;\n      state =\n        (replace ?? (typeof nextState !== 'object' || nextState === null))\n          ? (nextState as TState)\n          : Object.assign({}, state, nextState);\n      listeners.forEach((listener) =\u003e listener(state, previousState));\n    }\n  };\n\n  const getState: StoreApi\u003cTState\u003e['getState'] = () =\u003e state;\n\n  const getInitialState: StoreApi\u003cTState\u003e['getInitialState'] = () =\u003e initialState;\n\n  const subscribe: StoreApi\u003cTState\u003e['subscribe'] = (listener) =\u003e {\n    listeners.add(listener);\n    // Unsubscribe\n    return () =\u003e listeners.delete(listener);\n  };\n\n  const api = { setState, getState, getInitialState, subscribe };\n  const initialState = (state = createState(setState, getState, api));\n  return api as any;\n};\n```\n\n이 부분이 상태 관리 스토어를 구현하는 핵심 함수이다.\n\n`state`라는 변수로 현재 상태를 저장하고, `listeners`변수에 상태 변경에 대해 구독하고 있는 함수들을 따로 관리하고 있다.\n\n```ts\n  const setState: StoreApi\u003cTState\u003e['setState'] = (partial, replace) =\u003e {\n    const nextState =\n      typeof partial === 'function'\n        ? (partial as (state: TState) =\u003e TState)(state)\n        : partial\n```\n\n`setState` 함수는 새로운 상태를 설정하는 함수이다. 함수나 값을 받아서 상태를 업데이트할 수 있다. `partial`이 함수면 현재 상태를 인자로 실행하고, 아니면 값 그대로 사용한다.\n\n여기에서 상태 업데이트 로직을 살펴보자.\n\n```ts\nif (!Object.is(nextState, state)) {\n  const previousState = state;\n  state =\n    (replace ?? (typeof nextState !== 'object' || nextState === null))\n      ? (nextState as TState)\n      : Object.assign({}, state, nextState);\n  listeners.forEach((listener) =\u003e listener(state, previousState));\n}\n```\n\n새 상태가 현재 상태와 다른 경우에만 업데이트를 수행한다. `replace` 옵션이 `true`이거나 새 상태가 객체가 아닐 경우 완전히 대체한다. 객체인 경우 얕은 병합을 수행한다. 상태가 변경되면 모든 리스너에게 새 상태와 이전 상태를 전달한다.\n\n새 상태와 현재 상태를 비교하는 것은 `Object.is` 함수를 이용해서 하게 되는데, 비교 기준은 아래 문서에 자세하게 기술되어 있다.\n\n- [Object.is - MDN](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Object/is)\n\n```ts\nconst getState: StoreApi\u003cTState\u003e['getState'] = () =\u003e state;\n\nconst getInitialState: StoreApi\u003cTState\u003e['getInitialState'] = () =\u003e initialState;\n\nconst subscribe: StoreApi\u003cTState\u003e['subscribe'] = (listener) =\u003e {\n  listeners.add(listener);\n  // Unsubscribe\n  return () =\u003e listeners.delete(listener);\n};\n```\n\n그 외 아래 유틸리티 메서드들은 아주 쉽게 구현되어 있다.\n\n- `getState`: 현재 상태를 반환\n- `getInitialState`: 초기 상태를 반환\n- `subscribe`: 리스너를 등록하고 구독 해제 함수를 반환\n\n```ts\nconst api = { setState, getState, getInitialState, subscribe };\nconst initialState = (state = createState(setState, getState, api));\n```\n\n이후에 API 객체를 생성, 초기 상태를 설정하고 스토어 API를 반환한다.\n\n이 구현은 상태 관리의 핵심 패턴인 pub/sub 패턴을 사용하며, 불변성을 유지하면서 상태를 업데이트하는 안전한 방법을 제공한다.\n\n또한, `state` 변수를 클로저로 캡슐화하여 외부에서 직접 접근 불가능하게 상태 관리하였다.\n\n따라서 `getState`, `setState` 등이 클로저를 통해 상태를 관리할 수 있도록 API를 제공하고 있다.\n\n### createStore\n\n```ts\nexport const createStore = ((createState) =\u003e\n  createState ? createStoreImpl(createState) : createStoreImpl) as CreateStore;\n```\n\n결과적으로 해당 스토어를 생성하는 `createStoreImpl`함수를 위에서 언급한 두 가지 방법으로 제공하게 된다. (직접 실행, 커링)\n\n## Zustand - React\n\nZustand는 위에서 본 것처럼 특정 프레임워크나, 라이브러리 위에서만 동작되는 라이브러리가 아니다.\n\n그렇지만, 흔히 사용되는 리액트에서 쉽게 사용할 수 있도록 유틸리티를 제공하는데 이에 대해 살펴보자.\n\n### useStore\n\n```ts\nexport function useStore\u003cS extends ReadonlyStoreApi\u003cunknown\u003e\u003e(api: S): ExtractState\u003cS\u003e;\n\nexport function useStore\u003cS extends ReadonlyStoreApi\u003cunknown\u003e, U\u003e(api: S, selector: (state: ExtractState\u003cS\u003e) =\u003e U): U;\n\nexport function useStore\u003cTState, StateSlice\u003e(\n  api: ReadonlyStoreApi\u003cTState\u003e,\n  selector: (state: TState) =\u003e StateSlice = identity as any,\n) {\n  const slice = React.useSyncExternalStore(\n    api.subscribe,\n    () =\u003e selector(api.getState()),\n    () =\u003e selector(api.getInitialState()),\n  );\n  React.useDebugValue(slice);\n  return slice;\n}\n```\n\nZustand에서 `useStore`라는 훅을 제공하는데, 2가지의 함수 오버로드가 있다.\n\n1. 전체 상태를 반환\n2. `selector`를 통해서 선택된 상태를 반환\n\n이후에 아래 실제 구현 내용을 보면, `React.useSyncExternalStore`라는 함수를 통해서 리액트와 상호작용을 하게 된다는 것을 볼 수 있다.\n\n`React.useSyncExternalStore` 함수에 대해선 아래 내용을 참고하자.\n\n- [React.useSyncExternalStore](https://ko.react.dev/reference/react/useSyncExternalStore)\n\n이를 통해서 스토어의 변경에 대해 반응하게 되어, 렌더링을 진행하게 된다.\n\n이제, 이를 통해서 스토어를 생성하는 것에 대해서 더 살펴보자.\n\n### UseBoundStore\n\n```ts\nexport type UseBoundStore\u003cS extends ReadonlyStoreApi\u003cunknown\u003e\u003e = {\n  (): ExtractState\u003cS\u003e;\n  \u003cU\u003e(selector: (state: ExtractState\u003cS\u003e) =\u003e U): U;\n} \u0026 S;\n```\n\n이 타입은 아래 내용들을 결합한 상태를 나타낸다.\n\n1. 전체 상태를 반환하는 함수\n2. 선택자를 통한 부분 상태 접근\n3. 스토어 API 메서드들\n\n### Create\n\n```ts\ntype Create = {\n  \u003cT, Mos extends [StoreMutatorIdentifier, unknown][] = []\u003e(\n    initializer: StateCreator\u003cT, [], Mos\u003e,\n  ): UseBoundStore\u003cMutate\u003cStoreApi\u003cT\u003e, Mos\u003e\u003e;\n  \u003cT\u003e(): \u003cMos extends [StoreMutatorIdentifier, unknown][] = []\u003e(\n    initializer: StateCreator\u003cT, [], Mos\u003e,\n  ) =\u003e UseBoundStore\u003cMutate\u003cStoreApi\u003cT\u003e, Mos\u003e\u003e;\n};\n```\n\n스토어 생성을 하는 함수를 구현하기 전에 앞서, 타입을 정의하고 있는데 이전과 같이 두 가지 시그니처를 제공하고 있다.\n\n1. 직접 초기화\n2. 커링된 초기화\n\n### createImpl, create\n\n```ts\nconst createImpl = \u003cT\u003e(createState: StateCreator\u003cT, [], []\u003e) =\u003e {\n  const api = createStore(createState);\n\n  const useBoundStore: any = (selector?: any) =\u003e useStore(api, selector);\n\n  Object.assign(useBoundStore, api);\n\n  return useBoundStore;\n};\n\nexport const create = (\u003cT\u003e(createState: StateCreator\u003cT, [], []\u003e | undefined) =\u003e\n  createState ? createImpl(createState) : createImpl) as Create;\n```\n\n`vanilla.ts` 파일에서 볼 수 있었던 `createStore` 함수를 이용해서 스토어를 생성하고, `useStore` 훅을 연결한다.\n\n이를 이용해서 두 가지 오버로드된 시그니처 타입을 제공하는 `create` 함수를 통해서 스토어를 생성하고 `useStore` 훅을 통해서 리액트와 연결하여 사용할 수 있게 된다.\n\n## 마지막\n\nZustand는 간단하면서도 유연한 API로 상태를 관리하며, 내부적으로 pub/sub 패턴과 불변 상태 업데이트 로직을 사용해 상태 관리를 제공한다. 또한, 리액트의 `useSyncExternalStore` 훅을 통해서 리액트에서의 렌더링을 제공하고 있다.\n"])</script><script>self.__next_f.push([1,"0:{\"P\":null,\"b\":\"-uA8S7rsbPTcD2oa-PMhC\",\"p\":\"\",\"c\":[\"\",\"_not-found\",\"\"],\"i\"
